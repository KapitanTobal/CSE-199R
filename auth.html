<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Log In | Budget Dashboard</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>


</head>

<body class="auth-page">
  <header class="page-header">
    <h1>Welcome Back</h1>
    <p>Log in or create an account to save your budget securely.</p>
  </header>

  <main>
    <section class="auth-card">
      <h2>Account</h2>

        <form id="auth-form" method="post">
        <label for="email">Email address:</label>

        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          autocomplete="email"
          required
        >

        <label for="password">Password:</label>

        <input type="password" id="password" placeholder="At least 8 characters" minlength="8"
          autocomplete="current-password" required>
        <button type="submit" id="login-button">
          Log In
        </button>

        <button type="button" id="signup-button" class="outline-button">
          Create Account
        </button>

        <button type="button" id="forgot-password-button" class="text-button">
          Forgot password?
        </button>
      </form>

      <p id="auth-message" aria-live="polite"></p>

      <button type="button" id="logout-button" class="delete-button" hidden>
        Log Out
      </button>
    </section>
  </main>

  <script src="auth.js"></script>
</body>

</html>
