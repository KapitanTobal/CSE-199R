<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Log In | Budget Dashboard</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>

  
</head>

<body>
  <nav>
    <a href="index.html">Budget</a>
    <a href="subscriptions.html">Subscriptions</a>
    <a href="paycheck-planner.html">Paycheck Planner</a>
  </nav>

  <header class="page-header">
    <h1>Welcome Back</h1>
    <p>Log in or create an account to save your budget securely.</p>
  </header>

  <main>
    <section class="auth-card">
      <h2>Account</h2>

      <form id="auth-form">
        <label for="email">Email address:</label>

        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          required
        >

        <label for="password">Password:</label>

        <input
          type="password"
          id="password"
          placeholder="At least 6 characters"
          minlength="6"
          required
        >

        <button type="submit" id="login-button">
          Log In
        </button>

        <button type="button" id="signup-button" class="outline-button">
          Create Account
        </button>
      </form>

      <p id="auth-message" aria-live="polite"></p>

      <button type="button" id="logout-button" class="delete-button" hidden>
        Log Out
      </button>
    </section>
  </main>

  <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
    <a href="index.html" aria-label="Budget">
      <span aria-hidden="true">⌂</span>
      <small>Budget</small>
    </a>

    <a href="subscriptions.html" aria-label="Subscriptions">
      <span aria-hidden="true">▣</span>
      <small>Subscriptions</small>
    </a>

    <a href="index.html#expense-form" class="quick-add-button" aria-label="Add expense">
      <span aria-hidden="true">+</span>
    </a>

    <a href="paycheck-planner.html" aria-label="Paycheck Planner">
      <span aria-hidden="true">▥</span>
      <small>Planner</small>
    </a>

    <a href="auth.html" class="active" aria-label="Account">
      <span aria-hidden="true">●</span>
      <small>Account</small>
    </a>
  </nav>

  <script src="auth.js"></script>
</body>
</html>
