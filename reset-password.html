<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Reset Password | Budget Dashboard</title>

  <link rel="stylesheet" href="style.css">

  <meta name="theme-color" content="#007aff">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <meta name="theme-color" content="#087ff5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Budget">
</head>

<body class="auth-page">
  <header class="page-header">
    <h1>Reset Password</h1>
    <p>Choose a new password for your account.</p>
  </header>

  <main>
    <section class="auth-card">
      <form id="reset-password-form" method="post">
        <label for="new-password">
          New password:
        </label>

        <input type="password" id="new-password" placeholder="At least 8 characters" minlength="8"
          autocomplete="new-password" required>

        <label for="confirm-password">
          Confirm password:
        </label>

        <input type="password" id="confirm-password" placeholder="Repeat your password" minlength="8"
          autocomplete="new-password" required>

        <button type="submit">
          Save New Password
        </button>
      </form>

      <p id="reset-message" aria-live="polite"></p>

      <a href="auth.html" class="text-button">
        Back to Login
      </a>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="reset-password.js"></script>
</body>

</html>
