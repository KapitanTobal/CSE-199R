<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
    <title>Subscriptions | Budget Dashboard</title>
  
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
  
    <meta name="theme-color" content="#007aff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="default"
    >
  </head>
  
<body>
    <nav>
        <a href="index.html">Budget</a>
        <a href="subscriptions.html">Subscriptions</a>
        <a href="paycheck-planner.html">Paycheck Planner</a>
      </nav>

      <header class="page-header">
        <h1>Subscriptions</h1>
        <p>Keep track of recurring payments and renewal dates.</p>
      </header>

      <main>
      <section class="subscription-total-card">
        <div>
          <span class="summary-label">Monthly subscriptions</span>
          <strong class="subscription-total-amount">
            $<span id="subscription-total">0.00</span>
          </strong>
        </div>
        <span class="subscription-total-icon" aria-hidden="true">↻</span>
      </section>

      <section class="subscription-form-card">
        <h2>Add Subscription</h2>
        <p class="section-description">
          Add services, memberships, and other recurring payments.
        </p>
      
        <form id="subscription-form">
          <label for="subscription-name">Subscription name:</label>
          <input
            type="text"
            id="subscription-name"
            placeholder="Example: Netflix"
            maxlength="60"
            required
          >
      
          <label for="subscription-amount">Amount:</label>
          <input
            type="number"
            id="subscription-amount"
            min="0.01"
            step="0.01"
            placeholder="15.99"
            required
          >
      
          <label for="billing-cycle">Billing cycle:</label>
          <select id="billing-cycle" required>
            <option value="">Choose a cycle</option>
            <option value="Monthly">Monthly</option>
            <option value="Yearly">Yearly</option>
          </select>
      
          <label for="next-payment">Next payment date:</label>
          <input type="date" id="next-payment" required>
      
          <label>
            <input type="checkbox" id="autopay">
            Automatic payment
          </label>
      
          <button type="submit">Add Subscription</button>
        </form>
      </section>
      
      <section class="subscription-list-card">
        <div class="section-heading-row">
          <div>
            <h2>Your Subscriptions</h2>
            <p class="section-description">Upcoming recurring payments.</p>
          </div>
        </div>
        <ul id="subscription-list"></ul>
      </section>
      </main>

      <script src="subscriptions.js"></script>
      <script src="pwa.js"></script>
    
</body>
</html>
